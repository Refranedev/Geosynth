<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geosynth</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 50 L14 28 L28 14 L44 18 L56 34 L54 50 Z' fill='%2394a3b8'/%3E%3Cpath d='M14 28 L28 14 L34 30 L22 50 L8 50 Z' fill='%23cbd5e1'/%3E%3Cpath d='M34 30 L44 18 L56 34 L54 50 L22 50 Z' fill='%2364748b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#07182b;--panel:#0b2036;--panel2:#10304f;--line:#1c3d5e;--text:#e6f1fb;--muted:#8aa4bd;--accent:#38bdf8}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;overflow:hidden}
#sidebar{width:352px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;transition:margin .25s;z-index:1200}
body.collapsed #sidebar{margin-left:-352px}
#map_wrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--bg)}
.brand{padding:18px 20px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#0e3a5f,#0b2036)}
h1{margin:0;font-size:20px;letter-spacing:.02em}
section{padding:16px 20px;border-bottom:1px solid var(--line)}
h2{margin:0 0 12px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h3{margin:12px 0 4px;font-size:12px;color:var(--accent)}
label{display:block;margin-bottom:10px;font-size:12px;color:var(--muted)}
select,input[type=search],button.ghost,button.primary{width:100%;margin-top:4px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit}
select:disabled,button:disabled{opacity:.5}
button{cursor:pointer}button.primary{background:var(--accent);color:#06243d;font-weight:600;border:0}
button.ghost:hover,select:hover{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px}.row button{margin-top:0}
.search{position:relative;padding:14px 20px;border-bottom:1px solid var(--line)}
.search input{margin:0}
#search_results{position:absolute;left:20px;right:20px;top:58px;z-index:20;margin:0;padding:4px;list-style:none;background:var(--panel2);border:1px solid var(--accent);border-radius:8px;box-shadow:0 10px 30px #0008;max-height:320px;overflow-y:auto}
#search_results[hidden]{display:none}
#search_results button{all:unset;display:block;width:100%;padding:8px 10px;border-radius:6px;cursor:pointer;box-sizing:border-box}
#search_results button:hover{background:var(--line)}
#search_results small{color:var(--muted)}
.kind{float:right;font-size:10px;color:var(--accent);text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:20px}.kpi span,.kpi small{font-size:11px;color:var(--muted)}
.bars{margin-top:12px}
.bar{all:unset;display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;width:100%;padding:3px 4px;border-radius:6px;cursor:pointer;font-size:12px;box-sizing:border-box}
.bar:hover,.bar.active{background:var(--panel2)}
.bar .track{height:8px;border-radius:4px;background:#0a1a2c;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px}
.bar em{font-style:normal;text-align:right;color:var(--muted)}
.toggle{display:flex;gap:8px;align-items:center;margin:0 0 6px;color:var(--text);cursor:pointer}
#distance_status{margin:8px 0 0;font-size:12px;color:var(--accent)}
footer{padding:14px 20px;font-size:12px;color:var(--muted)}
#progress{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden;margin-bottom:8px}
#progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
#sidebar_toggle{position:absolute;top:10px;left:10px;z-index:1000;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:18px}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--panel);color:var(--text);border-color:var(--line)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip,.leaflet-tooltip{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 8px 24px #0009}
.leaflet-tooltip-top:before{border-top-color:var(--line)}
.leaflet-popup-close-button{color:var(--muted)!important}
.popup-details{max-height:280px;overflow-y:auto;min-width:200px}.popup-details h3{margin:0 0 8px;color:var(--text);font-size:15px}.popup-details p{margin:6px 0;font-size:12px}
.leaflet-tooltip.town-label{background:none;border:0;box-shadow:none;color:#cfe6fa;font-size:11px;text-shadow:0 0 4px #000,0 0 4px #000;padding:0}
.leaflet-tooltip.town-label:before{display:none}
#map.hide-labels .town-label{display:none}
.leaflet-control-scale-line{background:#07182bcc;color:var(--muted);border-color:var(--muted)}
.leaflet-control-attribution{background:#07182bb3!important;color:var(--muted)!important}

/* Map legend: a small "Legend" button that opens a two-tab panel on demand. */
.legend-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.legend-toggle{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-size:12px;font-weight:600;box-shadow:0 8px 24px #0009}
.legend-toggle:hover,.legend-toggle.on{border-color:var(--accent);color:var(--accent)}
.legend-toggle:focus-visible,.legend-close:focus-visible,.legend-tab:focus-visible,.legend-row:focus-visible{outline:2px solid var(--accent)}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0009;color:var(--text);font-size:12px;width:260px}
.legend[hidden]{display:none}
.legend-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 2px}
.legend-close{all:unset;box-sizing:border-box;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.legend-close:hover{color:var(--text)}
.legend-tabs{display:flex;gap:6px;padding:6px 12px 4px}
.legend-tab{all:unset;box-sizing:border-box;cursor:pointer;padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted)}
.legend-tab:hover{color:var(--text)}
.legend-tab.on{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.legend .note{margin:0;padding:4px 12px 8px;color:var(--muted);font-size:11px}
.legend .body{max-height:min(46vh,360px);overflow-y:auto;padding:0 6px 8px}
.legend .body[hidden]{display:none}
.legend-row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;width:100%;padding:4px 6px;border-radius:6px;cursor:pointer}
.legend-row:hover{background:var(--panel2)}
.legend-row.static{cursor:default}
.legend-row.static:hover{background:none}
.legend-row em{font-style:normal;color:var(--muted);font-size:11px}
.legend-swatch{width:12px;height:12px;border-radius:50%;border:1px solid #04111f;box-shadow:0 0 0 1px #ffffff40}
.legend-swatch.square{width:14px;height:12px;border-radius:3px;border:1px solid #ffffff55;box-shadow:none}
.legend-sep{margin:6px 6px 4px;border-top:1px solid var(--line)}
@media(max-width:820px){#sidebar{position:absolute;inset:0 auto 0 0;width:min(92vw,352px)}body.collapsed #sidebar{margin-left:-110%}}
</style>
</head>
<body>
<aside id="sidebar">
  <header class="brand">
    <h1>Geosynth</h1>
  </header>

  <div class="search">
    <input id="search_input" type="search" placeholder="Search occurrences, commodities, towns…  ( / )" autocomplete="off">
    <ul id="search_results" hidden></ul>
  </div>

  <section>
    <h2>Overview</h2>
    <div class="kpis">
      <div class="kpi"><b id="kpi_records">–</b><span>Occurrences</span><br><small id="kpi_total"></small></div>
      <div class="kpi"><b id="kpi_commodities">–</b><span>Commodities</span></div>
      <div class="kpi"><b id="kpi_regions">–</b><span>Regions</span></div>
    </div>
    <div id="commodity_bars" class="bars"></div>
  </section>

  <section>
    <h2>Filters</h2>
    <label>Main commodity
      <select id="commodity_select" disabled><option value="">All commodities</option></select>
    </label>
    <label>Region
      <select id="region_select" disabled><option value="">All regions</option></select>
    </label>
    <button id="filters_reset" class="ghost" type="button">Reset all filters</button>
  </section>

  <section>
    <h2>Near a town</h2>
    <label>Town
      <select id="town_select" disabled><option value="">Select a town</option></select>
    </label>
    <label>Within <b id="distance_value" style="color:var(--text)">50 km</b>
      <input id="distance_input" type="range" min="1" max="500" step="1" value="50">
    </label>
    <div class="row">
      <button id="distance_search_button" class="primary" type="button" disabled>Search nearby</button>
      <button id="distance_reset_button" class="ghost" type="button" disabled>Clear</button>
    </div>
    <p id="distance_status" aria-live="polite"></p>
  </section>

  <section>
    <h2>Map layers</h2>
    <div id="layer_list"></div>
    <label style="margin-top:12px">Geology opacity
      <input id="geology_opacity" type="range" min="0.1" max="1" step="0.05" value="0.72">
    </label>
  </section>

  <footer>
    <div id="progress"><i></i></div>
    <div id="status" aria-live="polite">Loading map datasets…</div>
  </footer>
</aside>

<main id="map_wrap">
  <div id="map"></div>
  <button id="sidebar_toggle" type="button" aria-label="Toggle panel">&#9776;</button>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const BG = "#07182b";

const COMMODITY_NAMES = {
  Au:"Gold", Ba:"Barite", Be:"Beryllium", Bi:"Bismuth", C_gr:"Graphite", Co:"Cobalt", Coal:"Coal",
  Cu:"Copper", Dia:"Diamond", Diat:"Diatomite", F:"Fluorite", Fe:"Iron", Gas:"Gas", Gem:"Gemstones",
  Gyp:"Gypsum", Li:"Lithium", Mn:"Manganese", NaCl:"Salt (halite)", Nb:"Niobium", Ni:"Nickel",
  PO4:"Phosphate", Pb:"Lead", Qz:"Quartz", REE:"Rare earth elements", Sep:"Sepiolite", Sn:"Tin",
  Ta:"Tantalum", Ti:"Titanium", U:"Uranium", V:"Vanadium", W:"Tungsten", Wol:"Wollastonite", Zn:"Zinc"
};
const COMMODITY_COLORS = {
  Cu:"#f59e0b", Au:"#facc15", U:"#a78bfa", Fe:"#ef4444", Mn:"#b45309", Zn:"#38bdf8",
  Pb:"#94a3b8", F:"#4ade80", Li:"#22d3ee", Sn:"#fb7185", Dia:"#e0f2fe"
};
const PALETTE = ["#f472b6","#34d399","#c084fc","#fbbf24","#22d3ee","#fb923c","#a3e635","#60a5fa","#e879f9","#2dd4bf"];
const REGION_NAMES = {
  "NA-ER":"Erongo", "NA-HA":"Hardap", "NA-KA":"Karas", "NA-KH":"Khomas", "NA-KU":"Kunene",
  "NA-OD":"Otjozondjupa", "NA-OH":"Omaheke", "NA-OS":"Omusati", "NA-OT":"Oshikoto"
};
// Colours the geological units layer and the Geology tab of the legend.
const GEOLOGY_COLORS = {
  "Quaternary":"rgb(249, 249, 127)", "Neogene":"rgb(255, 230, 25)",
  "Palaeogene to Neogene":"rgb(254, 194, 78)", "Palaeogene":"rgb(253, 154, 82)",
  "Cretaceous":"rgb(127, 198, 78)", "Jurassic to Cretaceous":"rgb(89, 190, 155)",
  "Jurassic":"rgb(52, 178, 201)", "Triassic":"rgb(129, 43, 146)",
  "Carboniferous to Triassic":"rgb(156, 90, 140)", "Permian":"rgb(240, 64, 40)",
  "Permo-Carboniferous":"rgb(200, 106, 80)",
  "Ordovician — late Salem-suite granites":"rgb(0, 146, 112)",
  "Cambrian":"rgb(127, 160, 86)", "Namibian":"rgb(254, 204, 92)",
  "Namaquan":"rgb(254, 217, 154)", "Kheisian":"rgb(247, 104, 152)",
  "Various":"rgb(204, 204, 204)", "Other / no age":"rgb(230, 230, 230)"
};

function commodity_color(code) {
  if (!code) return "#94a3b8";
  if (COMMODITY_COLORS[code]) return COMMODITY_COLORS[code];
  let hash = 0;
  for (const character of code) hash = (hash * 31 + character.charCodeAt(0)) >>> 0;
  return PALETTE[hash % PALETTE.length];
}

function commodity_label(code) {
  if (!code) return "Commodity not recorded";
  return COMMODITY_NAMES[code] ? `${COMMODITY_NAMES[code]} (${code})` : code;
}

// One shared canvas keeps every layer clickable; draw order sets the stacking.
const map = L.map("map", {
  renderer: L.canvas({ padding: 0.5 }),
  zoomControl: false,
  attributionControl: false,
  zoomSnap: 0.25,
  minZoom: 4
}).setView([-22.5, 17.5], 6);

L.control.zoom({ position: "topright" }).addTo(map);
L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);
L.control.attribution({ prefix: false }).addTo(map).addAttribution("Geosynth · PostGIS");

const layers = {};
const layer_boxes = {};
const group_boxes = {};
let mineral_api = null;
let search_index = [];

// Bottom to top. Anything outside Namibia is hidden by the mask.
const STACK = [
  "country_fill", "geological_units", "constituencies", "contours", "roads",
  "dykes_250k", "etendeka_dykes", "karoo_dykes", "faults", "mask", "regions",
  "country_boundary", "mineral_occurrences", "towns"
];

function restack() {
  for (const key of STACK) {
    const layer = layers[key];
    if (layer && map.hasLayer(layer)) layer.bringToFront();
  }
}

// Build a world polygon with Namibia cut out, so other countries disappear.
function build_mask(dataset) {
  const holes = [];

  for (const feature of dataset.features) {
    const geometry = feature.geometry;
    if (!geometry) continue;

    const polygons = geometry.type === "Polygon" ? [geometry.coordinates]
      : geometry.type === "MultiPolygon" ? geometry.coordinates : [];

    for (const polygon of polygons) {
      holes.push(polygon[0].map(([longitude, latitude]) => [latitude, longitude]));
    }
  }

  const world = [[-85, -540], [-85, 540], [85, 540], [85, -540]];

  return L.polygon([world, ...holes], {
    stroke: false, fillColor: BG, fillOpacity: 1, interactive: false
  });
}

// Create popups without interpreting record values as HTML.
function create_popup(title, details) {
  const container = document.createElement("div");
  container.className = "popup-details";

  const heading = document.createElement("h3");
  heading.textContent = title || "Unnamed feature";
  container.appendChild(heading);

  for (const [label, value] of details) {
    const paragraph = document.createElement("p");
    const label_element = document.createElement("strong");
    label_element.textContent = `${label}: `;
    paragraph.append(label_element, document.createTextNode(
      value === null || value === undefined || value === "" ? "Not recorded" : String(value)
    ));
    container.appendChild(paragraph);
  }

  return container;
}

function create_popup_handler(title_field, fallback_title, fields) {
  return (feature, layer) => {
    const properties = feature.properties || {};
    layer.bindPopup(create_popup(
      properties[title_field] || fallback_title,
      fields.map(([label, name]) => [label, properties[name]])
    ));
  };
}

function two_line_tooltip(layer, title, subtitle) {
  const content = document.createElement("div");
  const strong = document.createElement("strong");
  strong.textContent = title;
  const line = document.createElement("div");
  line.textContent = subtitle;
  content.append(strong, line);
  layer.bindTooltip(content, { direction: "top", sticky: true });
}

function fly_and_open(marker, zoom) {
  map.once("moveend", () => marker.openPopup());
  map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), zoom), { duration: 0.8 });
}

function show_layer(key) {
  const box = layer_boxes[key];
  if (box && !box.checked) {
    box.checked = true;
    box.dispatchEvent(new Event("change"));
  }
}

// Add a toggle row to the sidebar layer list.
function add_layer_row(configuration, layer) {
  let group = group_boxes[configuration.group];

  if (!group) {
    group = document.createElement("div");
    const heading = document.createElement("h3");
    heading.textContent = configuration.group;
    group.appendChild(heading);
    $("layer_list").appendChild(group);
    group_boxes[configuration.group] = group;
  }

  const label = document.createElement("label");
  label.className = "toggle";
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = map.hasLayer(layer);
  box.onchange = () => {
    if (box.checked) layer.addTo(map); else map.removeLayer(layer);
    restack();
  };
  const text = document.createElement("span");
  text.textContent = configuration.name;

  label.append(box, text);
  group.appendChild(label);
  layer_boxes[configuration.key] = box;
}

// Connect search, commodity, region and town-distance filters.
function connect_mineral_filters(dataset, layer) {
  const commodity_select = $("commodity_select");
  const region_select = $("region_select");
  const town_select = $("town_select");
  const distance_input = $("distance_input");
  const search_button = $("distance_search_button");
  const reset_button = $("distance_reset_button");
  const distance_status = $("distance_status");
  const has_value = value => value !== null && value !== undefined && value !== "";

  let active_features = dataset.features;
  let active_distance_label = "";
  let search_sequence = 0;

  $("kpi_total").textContent = `of ${dataset.features.length.toLocaleString()} total`;

  const commodities = [...new Set(
    dataset.features.map(f => f.properties?.commodity_main).filter(has_value)
  )].sort();
  for (const code of commodities) {
    commodity_select.add(new Option(commodity_label(code), code));
  }

  const region_codes = [...new Set(
    dataset.features.map(f => f.properties?.adm1_region).filter(has_value)
  )].sort((a, b) => (REGION_NAMES[a] || a).localeCompare(REGION_NAMES[b] || b));
  for (const code of region_codes) {
    region_select.add(new Option(REGION_NAMES[code] || code, code));
  }
  if (dataset.features.some(f => !f.properties?.adm1_region)) {
    region_select.add(new Option("Region not recorded", "__missing__"));
  }

  // Draw the KPI cards and the clickable commodity bars.
  function render_overview(matching, in_scope, selected) {
    $("kpi_records").textContent = matching.length.toLocaleString();
    $("kpi_commodities").textContent =
      new Set(matching.map(f => f.properties?.commodity_main).filter(has_value)).size;
    $("kpi_regions").textContent =
      new Set(matching.map(f => f.properties?.adm1_region).filter(has_value)).size;

    const counts = new Map();
    for (const feature of in_scope) {
      const code = feature.properties?.commodity_main;
      if (has_value(code)) counts.set(code, (counts.get(code) || 0) + 1);
    }

    const top = [...counts].sort((a, b) => b[1] - a[1]).slice(0, 7);
    const largest = top.length ? top[0][1] : 1;

    $("commodity_bars").replaceChildren(...top.map(([code, count]) => {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "bar" + (code === selected ? " active" : "");
      row.title = `Filter by ${commodity_label(code)}`;

      const name = document.createElement("span");
      name.textContent = COMMODITY_NAMES[code] || code;
      const track = document.createElement("span");
      track.className = "track";
      const fill = document.createElement("i");
      fill.style.width = `${(count / largest) * 100}%`;
      fill.style.background = commodity_color(code);
      track.appendChild(fill);
      const number = document.createElement("em");
      number.textContent = count;

      row.append(name, track, number);
      row.onclick = () => {
        commodity_select.value = code === selected ? "" : code;
        update();
      };
      return row;
    }));
  }

  // Apply commodity and region filters to the active distance results.
  function update() {
    const region = region_select.value;
    const commodity = commodity_select.value;

    const in_scope = active_features.filter(feature => {
      const code = feature.properties?.adm1_region;
      return !region || (region === "__missing__" ? !code : code === region);
    });

    const matching = commodity
      ? in_scope.filter(f => f.properties?.commodity_main === commodity)
      : in_scope;

    layer.clearLayers();
    layer.addData({ type: "FeatureCollection", features: matching });
    render_overview(matching, in_scope, commodity);
    distance_status.textContent = active_distance_label;
    restack();

    return matching.length;
  }

  async function load_search_towns() {
    const response = await fetch("/api/layers/towns");
    if (!response.ok) throw new Error(`Town loading failed: HTTP ${response.status}`);

    const towns = await response.json();
    const names = [...new Set(towns.features.map(f => f.properties?.NAME).filter(Boolean))].sort();
    for (const name of names) town_select.add(new Option(name, name));

    town_select.disabled = false;
    search_button.disabled = false;
  }

  // Request nearby records and keep the current filters.
  async function search_nearby() {
    const town_name = town_select.value;
    const distance_km = Number(distance_input.value);

    if (!town_name) {
      distance_status.textContent = "Select a town first.";
      return;
    }

    const request_sequence = ++search_sequence;
    search_button.disabled = true;
    reset_button.disabled = false;
    distance_status.textContent = "Searching nearby mineral records…";

    try {
      const parameters = new URLSearchParams({ town: town_name, distance_km: String(distance_km) });
      const response = await fetch(`/api/search/near-town?${parameters}`);
      if (!response.ok) throw new Error(`Distance search failed: HTTP ${response.status}`);

      const results = await response.json();
      if (results.type !== "FeatureCollection" || !Array.isArray(results.features)) {
        throw new Error("Distance search returned invalid GeoJSON.");
      }
      if (request_sequence !== search_sequence) return;

      active_features = results.features;
      active_distance_label = `Within ${distance_km} km of ${town_name} (straight line).`;
      show_layer("mineral_occurrences");

      if (update() > 0) {
        const bounds = layer.getBounds();
        if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 11 });
      }
    } catch (error) {
      if (request_sequence === search_sequence) {
        distance_status.textContent = `${error.message} Previous results remain displayed.`;
      }
      console.error(error);
    } finally {
      if (request_sequence === search_sequence) search_button.disabled = false;
    }
  }

  function clear_distance() {
    search_sequence += 1;
    active_features = dataset.features;
    active_distance_label = "";
    search_button.disabled = town_select.disabled;
    reset_button.disabled = true;
    update();
  }

  function reset_all() {
    commodity_select.value = "";
    region_select.value = "";
    clear_distance();
  }

  function find_marker(id) {
    let found = null;
    layer.eachLayer(marker => { if (marker.feature?.id === id) found = marker; });
    return found;
  }

  commodity_select.onchange = update;
  region_select.onchange = update;
  search_button.onclick = search_nearby;
  reset_button.onclick = clear_distance;
  $("filters_reset").onclick = reset_all;

  commodity_select.disabled = false;
  region_select.disabled = false;
  update();

  load_search_towns().catch(error => {
    distance_status.textContent = error.message;
    console.error(error);
  });

  return {
    // Show a record even if the current filters would hide it.
    focus(feature) {
      show_layer("mineral_occurrences");
      let marker = find_marker(feature.id);
      if (!marker) {
        reset_all();
        marker = find_marker(feature.id);
      }
      if (marker) fly_and_open(marker, 10);
    },

    // Filter by one commodity (click it again to clear). Used by the legend.
    set_commodity(code) {
      show_layer("mineral_occurrences");
      commodity_select.value = commodity_select.value === code ? "" : code;
      update();
    }
  };
}

// Index minerals and towns for the search bar.
function index_for_search(kind, features, describe) {
  for (const feature of features) {
    const info = describe(feature.properties || {});
    search_index.push({ kind, feature, title: info.title, subtitle: info.subtitle,
      text: info.text.toLowerCase() });
  }
}

function connect_search() {
  const input = $("search_input");
  const list = $("search_results");

  function pick(item) {
    input.value = item.title;
    list.hidden = true;

    if (item.kind === "Town") {
      show_layer("towns");
      let target = null;
      layers.towns.eachLayer(marker => {
        if (marker.feature === item.feature) target = marker;
      });
      if (target) fly_and_open(target, 9);
    } else if (mineral_api) {
      mineral_api.focus(item.feature);
    }
  }

  function run() {
    const term = input.value.trim().toLowerCase();
    list.replaceChildren();

    if (term.length < 2) {
      list.hidden = true;
      return;
    }

    const matches = search_index
      .filter(item => item.text.includes(term))
      .sort((a, b) => Number(b.title.toLowerCase().startsWith(term))
        - Number(a.title.toLowerCase().startsWith(term)))
      .slice(0, 8);

    if (!matches.length) {
      const empty = document.createElement("li");
      empty.style.cssText = "padding:8px 10px;color:var(--muted)";
      empty.textContent = "No matches found.";
      list.appendChild(empty);
    }

    for (const item of matches) {
      const row = document.createElement("li");
      const button = document.createElement("button");
      const kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = item.kind;
      const title = document.createElement("div");
      title.textContent = item.title;
      const subtitle = document.createElement("small");
      subtitle.textContent = item.subtitle || "";
      button.append(kind, title, subtitle);
      button.onclick = () => pick(item);
      row.appendChild(button);
      list.appendChild(row);
    }

    list.hidden = false;
    list._first = matches[0];
  }

  input.addEventListener("input", run);
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && list._first && !list.hidden) pick(list._first);
    if (event.key === "Escape") { input.value = ""; list.hidden = true; }
  });
  document.addEventListener("click", event => {
    if (!event.target.closest(".search")) list.hidden = true;
  });
  document.addEventListener("keydown", event => {
    if (event.key === "/" && document.activeElement !== input) {
      event.preventDefault();
      input.focus();
    }
  });
}

// Map legend: a "Legend" button that opens a panel with two tabs
// (Minerals and Geology). It stays closed until the person asks for it.
const LEGEND_TABS = [
  { id: "minerals", label: "Minerals", body: "commodity_legend_body",
    note: "Click a commodity to filter the map. Click again to clear." },
  { id: "geology", label: "Geology", body: "geology_legend_body",
    note: "Colour shows the age of each rock unit. Adjust opacity under Map layers." }
];

function add_map_legend() {
  const legend = L.control({ position: "bottomright" });

  legend.onAdd = () => {
    const container = document.createElement("div");
    container.className = "legend-wrap";

    const panel = document.createElement("div");
    panel.className = "legend";
    panel.id = "map_legend";
    panel.hidden = true;

    const header = document.createElement("div");
    header.className = "legend-head";
    const title = document.createElement("strong");
    title.textContent = "Map legend";
    const close = document.createElement("button");
    close.type = "button";
    close.className = "legend-close";
    close.setAttribute("aria-label", "Close legend");
    close.innerHTML = "&times;";
    header.append(title, close);

    const tabs = document.createElement("div");
    tabs.className = "legend-tabs";

    const note = document.createElement("p");
    note.className = "note";

    const bodies = {};
    const tab_buttons = {};

    function select_tab(id) {
      for (const tab of LEGEND_TABS) {
        const active = tab.id === id;
        tab_buttons[tab.id].classList.toggle("on", active);
        tab_buttons[tab.id].setAttribute("aria-selected", String(active));
        bodies[tab.id].hidden = !active;
        if (active) note.textContent = tab.note;
      }
    }

    for (const tab of LEGEND_TABS) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "legend-tab";
      button.setAttribute("role", "tab");
      button.textContent = tab.label;
      button.onclick = () => select_tab(tab.id);
      tab_buttons[tab.id] = button;
      tabs.appendChild(button);

      const body = document.createElement("div");
      body.className = "body";
      body.id = tab.body;
      body.textContent = "Loading…";
      bodies[tab.id] = body;
    }

    panel.append(header, tabs, note, ...LEGEND_TABS.map(tab => bodies[tab.id]));
    select_tab("minerals");

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "legend-toggle";
    toggle.textContent = "Legend";
    toggle.setAttribute("aria-controls", "map_legend");
    toggle.setAttribute("aria-expanded", "false");

    function set_open(open) {
      panel.hidden = !open;
      toggle.classList.toggle("on", open);
      toggle.setAttribute("aria-expanded", String(open));
    }

    toggle.onclick = () => set_open(panel.hidden);
    close.onclick = () => set_open(false);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") set_open(false);
    });

    container.append(panel, toggle);
    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);
    return container;
  };

  legend.addTo(map);
}

// One legend row. A code makes it a clickable commodity filter.
function make_legend_row(label, color, count, code, square = false) {
  const row = document.createElement(code ? "button" : "div");
  row.className = "legend-row" + (code ? "" : " static");
  if (code) {
    row.type = "button";
    row.title = `Filter by ${label}`;
    row.onclick = () => { if (mineral_api) mineral_api.set_commodity(code); };
  }

  const swatch = document.createElement("span");
  swatch.className = "legend-swatch" + (square ? " square" : "");
  swatch.style.background = color;
  const name = document.createElement("span");
  name.textContent = label;
  const number = document.createElement("em");
  number.textContent = count === null || count === undefined ? "" : count.toLocaleString();

  row.append(swatch, name, number);
  return row;
}

// Minerals tab: the commodities that exist in the loaded records.
function fill_commodity_legend(dataset) {
  const body = $("commodity_legend_body");
  if (!body) return;

  const counts = new Map();
  let unrecorded = 0;

  for (const feature of dataset.features) {
    const code = feature.properties?.commodity_main;
    if (code) counts.set(code, (counts.get(code) || 0) + 1);
    else unrecorded += 1;
  }

  const ordered = [...counts].sort((a, b) =>
    b[1] - a[1] || commodity_label(a[0]).localeCompare(commodity_label(b[0])));

  const rows = ordered.map(([code, count]) =>
    make_legend_row(commodity_label(code), commodity_color(code), count, code));

  if (unrecorded) {
    rows.push(make_legend_row("Commodity not recorded", commodity_color(null), unrecorded, null));
  }

  // Towns are drawn with their own symbol, so explain it here too.
  const separator = document.createElement("div");
  separator.className = "legend-sep";
  const town_row = make_legend_row("Town", "#e0f2fe", null, null);
  town_row.firstElementChild.style.borderColor = "#0ea5e9";
  rows.push(separator, town_row);

  body.replaceChildren(...rows);
}

// Geology tab: rock-unit ages in geological order. Pass the loaded units
// to hide ages that are not on the map and to show unit counts.
function fill_geology_legend(dataset) {
  const body = $("geology_legend_body");
  if (!body) return;

  const counts = new Map();

  if (dataset) {
    for (const feature of dataset.features) {
      const age = feature.properties?.age_name;
      const key = GEOLOGY_COLORS[age] ? age : "Other / no age";
      counts.set(key, (counts.get(key) || 0) + 1);
    }
  }

  const rows = Object.entries(GEOLOGY_COLORS)
    .filter(([age]) => !dataset || counts.has(age))
    .map(([age, color]) =>
      make_legend_row(age, color, dataset ? counts.get(age) : null, null, true));

  body.replaceChildren(...rows);
}

// Fetch a database layer and register it on the map.
async function load_layer(configuration) {
  const response = await fetch(`/api/layers/${configuration.key}`);
  if (!response.ok) throw new Error(`${configuration.name}: HTTP ${response.status}`);

  const dataset = await response.json();
  if (dataset.type !== "FeatureCollection" || !Array.isArray(dataset.features)) {
    throw new Error(`${configuration.name}: invalid GeoJSON`);
  }

  const layer = configuration.build
    ? configuration.build(dataset)
    : L.geoJSON(dataset, configuration.options);

  layers[configuration.key] = layer;
  if (configuration.visible) layer.addTo(map);
  add_layer_row(configuration, layer);
  if (configuration.after) configuration.after(layer, dataset);
  restack();
  return layer;
}

// Style helpers shared by the line layers.
const line_options = (color, weight, extra = {}) => ({
  interactive: false, style: { color, weight, opacity: 0.85, fill: false }, ...extra
});

const CONFIGURATIONS = [
  {
    key: "country_boundary", name: "Country border", group: "Boundaries", visible: true,
    build: dataset => {
      layers.country_fill = L.geoJSON(dataset, {
        interactive: false, style: { stroke: false, fillColor: "#0c2a47", fillOpacity: 1 }
      }).addTo(map);
      layers.mask = build_mask(dataset).addTo(map);

      const glow = L.geoJSON(dataset, line_options("#38bdf8", 9, {
        style: { color: "#38bdf8", weight: 9, opacity: 0.14, fill: false }
      }));
      const edge = L.geoJSON(dataset, line_options("#7dd3fc", 1.6));
      return L.featureGroup([glow, edge]);
    },
    after: layer => {
      const bounds = layer.getBounds();
      if (!bounds.isValid()) return;
      map.fitBounds(bounds, { padding: [20, 20] });
      map.setMaxBounds(bounds.pad(0.35));
      map.setMinZoom(map.getZoom() - 0.5);
    }
  },
  {
    key: "regions", name: "Regions", group: "Boundaries", visible: true,
    options: line_options("#5b8db8", 1)
  },
  {
    key: "mineral_occurrences", name: "Mineral occurrences", group: "Points", visible: true,
    options: {
      pointToLayer: (feature, location) => L.circleMarker(location, {
        radius: 5, color: "#04111f", weight: 1, fillOpacity: 0.95,
        fillColor: commodity_color(feature.properties?.commodity_main)
      }),
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        two_line_tooltip(layer, p.occ_name || "Unnamed occurrence", commodity_label(p.commodity_main));

        const details = [
          ["Reference", p.occ_id],
          ["Main commodity", commodity_label(p.commodity_main)],
          ["Other commodities", p.commodities_other],
          ["Region", REGION_NAMES[p.adm1_region] || p.adm1_region],
          ["Constituency", p.constituency],
          ["Host unit", p.host_unit_name],
          ["Geology", p.geology_note],
          ["Source", p.source_id],
          ["Source reference", p.source_ref],
          ["Confidence code", p.data_confidence],
          ["Date accessed", p.date_accessed]
        ];
        if (typeof p.distance_km === "number") {
          details.unshift(["Distance from searched town", `${p.distance_km.toFixed(2)} km`]);
        }
        layer.bindPopup(create_popup(p.occ_name, details));
      }
    },
    after: (layer, dataset) => {
      mineral_api = connect_mineral_filters(dataset, layer);
      fill_commodity_legend(dataset);
      index_for_search("Mineral", dataset.features, p => ({
        title: p.occ_name || "Unnamed occurrence",
        subtitle: [commodity_label(p.commodity_main), REGION_NAMES[p.adm1_region]]
          .filter(Boolean).join(" · "),
        text: [p.occ_name, p.commodity_main, COMMODITY_NAMES[p.commodity_main],
          p.host_unit_name, REGION_NAMES[p.adm1_region]].filter(Boolean).join(" ")
      }));
    }
  },
  {
    key: "towns", name: "Towns", group: "Points", visible: true,
    options: {
      pointToLayer: (feature, location) => L.circleMarker(location, {
        radius: 4.5, color: "#0ea5e9", weight: 2, fillColor: "#e0f2fe", fillOpacity: 1
      }),
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        layer.bindTooltip(p.NAME || "Unnamed town", {
          permanent: true, direction: "right", offset: [6, 0], className: "town-label"
        });
        layer.bindPopup(create_popup(p.NAME || "Unnamed town", [["Classification", p.SIZE]]));
      }
    },
    after: (layer, dataset) => {
      index_for_search("Town", dataset.features, p => ({
        title: p.NAME || "Unnamed town", subtitle: p.SIZE || "", text: p.NAME || ""
      }));
    }
  },
  {
    key: "geological_units", name: "Geological units", group: "Geology", visible: true,
    options: {
      style: feature => ({
        color: "#06182b", weight: 0.4, opacity: 0.6,
        fillColor: GEOLOGY_COLORS[feature.properties?.age_name] || GEOLOGY_COLORS["Other / no age"],
        fillOpacity: Number($("geology_opacity").value)
      }),
      onEachFeature: create_popup_handler("unit_name", "Geological unit", [
        ["Unit reference", "unit_id"], ["Era", "era"], ["Age name", "age_name"],
        ["Lithology", "lithology"], ["Rock types", "rock_types"],
        ["Tectonic province", "tectonic_province"], ["Source", "source_id"]
      ])
    },
    after: (layer, dataset) => fill_geology_legend(dataset)
  },
  {
    key: "constituencies", name: "Constituencies", group: "Boundaries", visible: false,
    options: line_options("#3b6a94", 0.8)
  },
  {
    key: "roads", name: "Main roads", group: "Infrastructure", visible: false,
    options: line_options("#f59e0b", 1.6)
  },
  {
    key: "faults", name: "Faults", group: "Structures", visible: false,
    options: {
      style: feature => ({
        color: "#f87171", weight: 1.6, opacity: 0.9,
        dashArray: /inferred/i.test(feature.properties?.TYPE || "") ? "6 4" : null
      }),
      onEachFeature: create_popup_handler("NAME", "Geological fault",
        [["Type", "TYPE"], ["Symbol code", "SYMCODE"]])
    }
  },
  ...[
    ["dykes_250k", "Dykes — 250k", "#a78bfa"],
    ["etendeka_dykes", "Etendeka dykes", "#38bdf8"],
    ["karoo_dykes", "Karoo dykes", "#fb923c"]
  ].map(([key, name, color]) => ({
    key, name, group: "Structures", visible: false,
    options: {
      style: { color, weight: 1.3, opacity: 0.9 },
      onEachFeature: create_popup_handler("UNIT", name, [
        ["Lithology", "LITHOLOGY"], ["Unit", "UNIT"],
        ["Lithology code", "LITHCODE"], ["Annotation", "ANNOT"]
      ])
    }
  })),
  {
    key: "contours", name: "Elevation contours", group: "Infrastructure", visible: false,
    options: line_options("#b45309", 0.8, {
      style: { color: "#b45309", weight: 0.8, opacity: 0.6, fill: false }
    })
  }
];

async function start_map() {
  const errors = [];
  let loaded = 0;

  add_map_legend();
  // Show the full age key right away; it is refined once the units load.
  fill_geology_legend(null);
  connect_search();

  for (const configuration of CONFIGURATIONS) {
    $("status").textContent = `Loading ${configuration.name.toLowerCase()}…`;
    $("progress").firstElementChild.style.width =
      `${(loaded + errors.length) / CONFIGURATIONS.length * 100}%`;

    try {
      await load_layer(configuration);
      loaded += 1;
    } catch (error) {
      console.error(error);
      errors.push(error.message);
    }
  }

  $("progress").firstElementChild.style.width = "100%";
  $("status").textContent = errors.length
    ? `${loaded}/${CONFIGURATIONS.length} layers loaded. ${errors.join("; ")}`
    : `All ${CONFIGURATIONS.length} layers loaded from PostGIS.`;
}

// Interface wiring.
$("distance_input").oninput = event => {
  $("distance_value").textContent = `${event.target.value} km`;
};

$("geology_opacity").oninput = event => {
  if (layers.geological_units) {
    layers.geological_units.setStyle({ fillOpacity: Number(event.target.value) });
  }
};

$("sidebar_toggle").onclick = () => {
  document.body.classList.toggle("collapsed");
  setTimeout(() => map.invalidateSize(), 280);
};

if (window.innerWidth < 820) document.body.classList.add("collapsed");

map.on("zoomend", () => $("map").classList.toggle("hide-labels", map.getZoom() < 6.5));

start_map();
</script>
